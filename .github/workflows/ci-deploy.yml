name: Test

on:
  push:
    branches: [main, 'hardening/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: contextiq_test
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: contextiq_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U contextiq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_operations.py -q
      - run: python -m pytest tests/test_postgres_operations.py -q
        env:
          POSTGRES_TEST_URL: postgresql://contextiq_test:isolated-ci-password@localhost:5432/contextiq_test
          CONTEXTIQ_MOCK_STORE: ${{ runner.temp }}/contextiq-postgres-mock.json
      - name: PostgreSQL backup and restore drill
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          POSTGRES_TEST_URL: postgresql://contextiq_test:isolated-ci-password@localhost:5432/contextiq_test
        run: |
          docker exec "$PG_CONTAINER" pg_dump -U contextiq_test -d contextiq_test -Fc -f /tmp/restore-test.dump
          docker exec "$PG_CONTAINER" createdb -U contextiq_test contextiq_restore
          docker exec "$PG_CONTAINER" pg_restore -U contextiq_test -d contextiq_restore --single-transaction --no-owner --no-privileges /tmp/restore-test.dump
          python tools/verify_restore.py
      - run: python -m pytest tests/test_v2.py -q
        env:
          PAYPAL_ENV: mock
          CONTEXTIQ_LEGACY_TEST_AUTH: "0"
          CONTEXTIQ_MOCK_STORE: ${{ runner.temp }}/contextiq-v2-mock.json
      - run: python -m pytest tests/test_experience.py -q
        env:
          GROQ_API_KEY: ""
          ANTHROPIC_API_KEY: ""
      - run: python -m pytest tests/test_seller.py -q
        env:
          PAYPAL_ENV: mock
          CONTEXTIQ_LEGACY_TEST_AUTH: "0"
          CONTEXTIQ_MOCK_STORE: ${{ runner.temp }}/contextiq-seller-mock.json
      - run: python -m pytest tests/test_flows.py -q
        env:
          PAYPAL_ENV: mock
          CONTEXTIQ_LEGACY_TEST_AUTH: "1"
          CONTEXTIQ_MOCK_STORE: ${{ runner.temp }}/contextiq-legacy-mock.json
      - run: node brightmart/build.mjs
        env:
          RENDER_APP_URL: https://contextiq.example.com
      - run: node build-contextiq.mjs
      - run: node --test tests/tour.test.cjs tests/experience.test.cjs
