name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_v2.py -q
        env:
          PAYPAL_ENV: mock
          CONTEXTIQ_LEGACY_TEST_AUTH: "0"
          CONTEXTIQ_MOCK_STORE: ${{ runner.temp }}/contextiq-v2-mock.json
      - run: python -m pytest tests/test_flows.py -q
        env:
          PAYPAL_ENV: mock
          CONTEXTIQ_LEGACY_TEST_AUTH: "1"
          CONTEXTIQ_MOCK_STORE: ${{ runner.temp }}/contextiq-legacy-mock.json
      - run: node brightmart/build.mjs
        env:
          RENDER_APP_URL: https://contextiq.example.com
      - run: node build-contextiq.mjs
