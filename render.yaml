services:
  - type: web
    name: contextiq-v2-ganesh
    runtime: python
    plan: free
    branch: main
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /api/config
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.6
      - key: HOST
        value: 0.0.0.0
      - key: CONTEXTIQ_HOSTED_DEMO
        value: "1"
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL_SMALL
        value: openai/gpt-oss-20b
      - key: GROQ_MODEL_LARGE
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      - key: SERVER_SECRET
        generateValue: true
      - key: CONTEXTIQ_STORE_URL
        sync: false
