# Optional separate paid worker. Review this deployment before provisioning it.
# Uses the API's existing managed PostgreSQL and server secret; no Redis is required.
services:
  - type: worker
    name: contextiq-durable-worker
    runtime: python
    plan: 0.5c-512mb
    region: virginia
    branch: main
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m app.worker
    maxShutdownDelaySeconds: 120
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.6
      - key: DATABASE_URL
        sync: false
      - key: SERVER_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CONTEXTIQ_HOSTED_DEMO
        value: "1"
      - key: CONTEXTIQ_WORKER_MODE
        value: external
      - key: LLM_PROVIDER
        value: groq
